name: Mottu
description: >-
  Mottu is the leading motorcycle-rental ecosystem in Latin America, founded in 2020 in
  Sao Paulo, Brazil by Rubens Zanelatto. It rents motorcycles to gig and delivery couriers
  who lack access to traditional credit, bundling insurance, maintenance, 24-hour support
  and financial services (Mottu Pay) so workers can earn income through food delivery,
  e-commerce and last-mile logistics. Mottu has verticalized the value chain, running its
  own assembly line, parts and service network, and fleet-management software, and offers
  white-labeled last-mile delivery (Mottu Entregas) to more than 1,000 retailers across
  100+ cities in Brazil and Mexico. Backed by QED Investors, Mottu has raised over US$150M.
  It operates as a consumer and B2B mobility/fintech app and does not publish a public
  developer API.
